[tool.poetry]
name = "timelapsed"
version = "1.0.0"
description = "Captures stills from ISAPI/Hikvision and Dahua NVRs and renders hourly, daily and weekly timelapses"
authors = ["Delisson Silva <delisonjunio@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "timelapsed" }]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.3"
backoff = "^2.2.1"
rich = "^13.9.4"
python-dateutil = "^2.9.0.post0"
# Recognition. Deliberately just these three: the libraries that publish these
# models pull in OpenCV and a torch-adjacent stack, which does not fit a guest
# that also runs six capture workers and ffmpeg.
onnxruntime = "^1.20.0"
numpy = "^2.1.0"
pillow = "^11.0.0"
flask = "^3.1"
waitress = "^3.0"
newrelic = "^10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pyright = "^1.1.411"
pre-commit = "^4.6.2"

[tool.poetry.scripts]
timelapsed = "timelapsed.timelapsed:run"
timelapsed-web = "timelapsed.web:run"
timelapsed-analyzer = "timelapsed.analyzer:run"
timelapsed-archiver = "timelapsed.archiver:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["timelapsed", "tests"]
pythonVersion = "3.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
