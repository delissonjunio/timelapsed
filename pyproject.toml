[tool.poetry]
name = "timelapsed"
version = "1.0.0"
description = "Captures stills from an ISAPI/Hikvision NVR and renders hourly, daily and weekly timelapses"
authors = ["Delisson Silva <delisonjunio@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "timelapsed" }]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.3"
backoff = "^2.2.1"
rich = "^13.9.4"
python-dateutil = "^2.9.0.post0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"

[tool.poetry.scripts]
timelapsed = "timelapsed.timelapsed:run"
timelapsed-web = "timelapsed.web:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
