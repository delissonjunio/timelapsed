<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>System status &middot; Timelapsed</title>
<link rel="icon" href="__FAVICON__">
<style>
/*__BASE_CSS__*/
:root {
  --ok:#34d399; --warn:#f59e0b; --bad:#ff6b6b; --info:#5b9dff;
  --hourly:#5b9dff; --daily:#a78bfa; --weekly:#34d399; --monthly:#f59e0b; --progress:#ec4899;
  --image:#5b9dff; --keyframe:#a78bfa; --timelapse:#34d399; --crops:#f59e0b; --index:#ec4899;
}
body {
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column;
}
header { position:sticky; top:0; z-index:5; }
/* The health dot keeps the headline company on the page's side of the
   navbar, coloured by the worst check. */
header .health { display:flex; align-items:center; gap:.5rem; }
header .health .dot { background:var(--ok); box-shadow:0 0 8px var(--ok); }
header .health .dot.warn { background:var(--warn); box-shadow:0 0 8px var(--warn); }
header .health .dot.bad  { background:var(--bad);  box-shadow:0 0 8px var(--bad); }

main { flex:1; overflow-y:auto; padding:1.1rem 1.25rem 3rem; }
.wrap { max-width:1180px; margin:0 auto; }

/* The headline row. Six numbers that between them say whether anything needs
   looking at; everything below is the working behind one of them. */
.tiles { display:grid; gap:.7rem; grid-template-columns:repeat(auto-fit, minmax(178px, 1fr));
         margin-bottom:1.2rem; }
.tile { background:var(--panel); border:1px solid var(--line); border-radius:11px;
        padding:.75rem .85rem .8rem; }
.tile .label { font-size:.63rem; letter-spacing:.13em; text-transform:uppercase;
               color:var(--muted); }
.tile .value { font-size:1.5rem; line-height:1.25; font-variant-numeric:tabular-nums;
               margin-top:.15rem; overflow-wrap:anywhere; }
.tile .value.ok { color:var(--ok); } .tile .value.warn { color:var(--warn); }
.tile .value.bad { color:var(--bad); }
.tile .sub { font-size:.7rem; color:var(--muted); font-variant-numeric:tabular-nums;
             margin-top:.1rem; }
.tile .bar { margin-top:.5rem; }

/* A meter, used for disk and for retention. The fill is coloured by how close
   to the limit it is, so the colour and the number never disagree. */
.bar { height:6px; border-radius:3px; background:var(--panel-2); overflow:hidden; display:flex; }
.bar > span { display:block; height:100%; }
.bar .ok { background:var(--ok); } .bar .warn { background:var(--warn); }
.bar .bad { background:var(--bad); } .bar .accent { background:var(--accent); }

section { margin-bottom:1.5rem; }
section > h2 { font-size:.68rem; letter-spacing:.14em; text-transform:uppercase;
               color:var(--muted); margin:0 0 .55rem; font-weight:700; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:11px;
         overflow:hidden; }
.panel + .panel { margin-top:.7rem; }
.panel .head { padding:.6rem .85rem; border-bottom:1px solid var(--line);
               font-size:.78rem; color:var(--muted); display:flex; gap:.6rem;
               align-items:baseline; flex-wrap:wrap; }
.panel .head b { color:var(--fg); font-weight:600; }
.panel .body { padding:.85rem; }

/* Checks. One row each, colour-led, worst first -- the list is empty on a
   healthy server, which is itself the most useful state to be able to see. */
.checks { display:flex; flex-direction:column; gap:.4rem; }
.check { display:flex; gap:.6rem; align-items:flex-start; padding:.55rem .7rem;
         border:1px solid var(--line); border-left-width:3px; border-radius:8px;
         background:var(--panel); }
.check.error { border-left-color:var(--bad); }
.check.warn  { border-left-color:var(--warn); }
.check.info  { border-left-color:var(--info); }
.check .txt { min-width:0; }
.check .title { font-size:.85rem; }
.check .detail { font-size:.74rem; color:var(--muted); overflow-wrap:anywhere; }
.allclear { display:flex; align-items:center; gap:.6rem; padding:.7rem .85rem;
            border:1px solid var(--line); border-left:3px solid var(--ok);
            border-radius:8px; background:var(--panel); font-size:.85rem; }

table { width:100%; border-collapse:collapse; font-size:.8rem; }
th, td { text-align:left; padding:.42rem .6rem; border-bottom:1px solid var(--line);
         white-space:nowrap; }
th { font-size:.63rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
     font-weight:600; }
tr:last-child td { border-bottom:none; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
td.dim { color:var(--muted); }
/* Wide tables scroll inside their own panel rather than the page. */
.scroll { overflow-x:auto; }

.pill { display:inline-block; padding:.05rem .42rem; border-radius:999px; font-size:.66rem;
        letter-spacing:.04em; text-transform:uppercase; border:1px solid var(--line);
        color:var(--muted); }
.pill.ok   { color:var(--ok);   border-color:color-mix(in srgb, var(--ok) 45%, var(--line)); }
.pill.warn { color:var(--warn); border-color:color-mix(in srgb, var(--warn) 45%, var(--line)); }
.pill.bad  { color:var(--bad);  border-color:color-mix(in srgb, var(--bad) 45%, var(--line)); }

/* Storage composition: one bar for the whole library, keyed underneath. */
.stack { height:20px; border-radius:6px; overflow:hidden; display:flex; background:var(--panel-2); }
.stack > span { display:block; height:100%; }
.key { display:flex; flex-wrap:wrap; gap:.5rem 1rem; margin-top:.6rem; font-size:.73rem;
       color:var(--muted); }
.key .item { display:flex; align-items:center; gap:.35rem; }
.key .swatch { width:9px; height:9px; border-radius:2px; flex:none; }
.key b { color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums; }

.pairs { display:grid; gap:.35rem 1.4rem; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
         font-size:.79rem; }
.pairs div { display:flex; gap:.6rem; align-items:baseline; }
.pairs .k { color:var(--muted); flex:none; }
.pairs .v { margin-left:auto; font-variant-numeric:tabular-nums; overflow-wrap:anywhere;
            text-align:right; }

.btn { background:var(--panel-2); border:1px solid var(--line); color:var(--fg); font:inherit;
       font-size:.72rem; cursor:pointer; padding:.28rem .65rem; border-radius:6px; }
.btn:hover { border-color:var(--accent); }
.btn[disabled] { opacity:.5; cursor:default; }
.empty { color:var(--muted); font-size:.85rem; padding:1.2rem 0; line-height:1.6; max-width:46rem; }
.note { color:var(--muted); font-size:.72rem; margin:.7rem 0 0; line-height:1.5; max-width:52rem; }

@media (max-width:700px) {
  main { padding:.9rem .75rem 2.5rem; }
  .tile .value { font-size:1.25rem; }
}
</style>
</head>
<body>
<header>
  <!--__NAV__-->
  <span class="spacer"></span>
  <span class="health">
    <span class="dot" id="healthdot"></span>
    <span class="stat" id="stat">Loading&hellip;</span>
  </span>
  <button class="btn" id="refresh">Refresh</button>
</header>

<main><div class="wrap" id="content"></div></main>

<noscript><p style="padding:1rem">This page needs JavaScript. The raw report is at
  <a href="/api/system">/api/system</a>.</p></noscript>

<script>
const $ = id => document.getElementById(id);
//__SHARED_JS__

const state = { report: null, error: null, loadedAt: null, loading: false };

// --- formatting -------------------------------------------------------------

// Decimal, not binary: `df`, the disk vendor and the config's own
// `min_free_disk_gb` all mean 10^9, and a page that disagreed with df by 7%
// would be the thing people trusted least on it.
function bytes(n) {
  if (n === null || n === undefined) return "\u2014";
  if (n < 1000) return n + " B";
  const units = ["kB", "MB", "GB", "TB", "PB"];
  let value = n, unit = -1;
  while (value >= 1000 && unit < units.length - 1) { value /= 1000; unit++; }
  return value.toFixed(value < 10 && unit > 0 ? 1 : 0) + " " + units[unit];
}

function count(n) {
  return (n === null || n === undefined) ? "\u2014" : n.toLocaleString();
}

// Durations are read at a glance and compared against each other, so they get
// one significant unit rather than a full breakdown.
function dur(seconds) {
  if (seconds === null || seconds === undefined) return "\u2014";
  const s = Math.abs(seconds);
  if (s < 1) return "now";
  if (s < 90) return Math.round(s) + "s";
  if (s < 5400) return Math.round(s / 60) + "m";
  if (s < 172800) return (s / 3600).toFixed(1) + "h";
  if (s < 5184000) return (s / 86400).toFixed(1) + "d";
  if (s < 47304000) return (s / 2592000).toFixed(1) + "mo";
  return (s / 31536000).toFixed(1) + "y";
}

function ago(iso) {
  if (!iso) return "never";
  return dur((Date.now() - Date.parse(iso)) / 1000) + " ago";
}

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const pad = n => String(n).padStart(2, "0");
function stamp(iso) {
  if (!iso) return "\u2014";
  const d = new Date(iso);
  return d.getDate() + " " + MONTHS[d.getMonth()] + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

const pct = fraction =>
  fraction === null || fraction === undefined ? "\u2014" : (fraction * 100).toFixed(1) + "%";

// --- small builders ---------------------------------------------------------

function tile(label, value, sub, tone) {
  const box = el("div", "tile");
  box.append(el("div", "label", label));
  box.append(el("div", "value" + (tone ? " " + tone : ""), value));
  if (sub !== undefined && sub !== null) box.append(el("div", "sub", sub));
  return box;
}

function meter(fraction, tone) {
  const bar = el("div", "bar");
  const fill = el("span", tone || "accent");
  fill.style.width = Math.max(0, Math.min(1, fraction || 0)) * 100 + "%";
  bar.appendChild(fill);
  return bar;
}

function pill(text, tone) {
  return el("span", "pill" + (tone ? " " + tone : ""), text);
}

function panel(headParts) {
  const box = el("div", "panel");
  if (headParts && headParts.length) {
    const head = el("div", "head");
    for (const part of headParts) {
      head.appendChild(typeof part === "string" ? el("span", "", part) : part);
    }
    box.appendChild(head);
  }
  const body = el("div", "body");
  box.appendChild(body);
  box.body = body;
  return box;
}

// Tables carry a `num` flag per column so alignment is declared once with the
// header rather than repeated on every cell.
function table(columns, rows) {
  const scroll = el("div", "scroll");
  const node = el("table");
  const head = el("tr");
  for (const column of columns) {
    head.appendChild(el("th", column.num ? "num" : "", column.label));
  }
  node.appendChild(el("thead")).appendChild(head);
  const tbody = el("tbody");
  for (const row of rows) {
    const line = el("tr");
    row.forEach((cell, position) => {
      const column = columns[position] || {};
      const td = el("td", [column.num ? "num" : "", cell && cell.dim ? "dim" : ""].join(" ").trim());
      if (cell && cell.node) td.appendChild(cell.node);
      else td.textContent = cell && cell.text !== undefined ? cell.text : (cell === null || cell === undefined ? "\u2014" : cell);
      line.appendChild(td);
    });
    tbody.appendChild(line);
  }
  node.appendChild(tbody);
  scroll.appendChild(node);
  return scroll;
}

const cell = (text, options) => Object.assign({text: text}, options || {});
const nodeCell = node => ({node: node});

function pairs(entries) {
  const box = el("div", "pairs");
  for (const [key, value] of entries) {
    const line = el("div");
    line.append(el("span", "k", key), el("span", "v", value));
    box.appendChild(line);
  }
  return box;
}

function section(title, ...children) {
  const node = el("section");
  node.appendChild(el("h2", "", title));
  for (const child of children) if (child) node.appendChild(child);
  return node;
}

// --- the page ---------------------------------------------------------------

async function load(force) {
  state.loading = true;
  $("refresh").disabled = true;
  try {
    const response = await fetch("/api/system" + (force ? "?refresh=1" : ""));
    if (!response.ok) throw new Error("HTTP " + response.status);
    state.report = await response.json();
    state.error = null;
    state.loadedAt = Date.now();
  } catch (err) {
    // Keep the last good report on screen. A momentary failure to refresh is
    // far less interesting than the numbers already up, and blanking the page
    // would throw away the thing someone opened it to read.
    state.error = String(err.message || err);
  }
  state.loading = false;
  $("refresh").disabled = false;
  draw();
}

function draw() {
  const report = state.report;
  const content = $("content");
  content.textContent = "";
  drawStat();

  if (!report) {
    content.appendChild(el("p", "empty",
      state.error ? "Could not load the status report: " + state.error : "Loading\u2026"));
    return;
  }

  $("librarylink").hidden = !(report.analysis && report.analysis.reachable);
  const worst = report.checks.length ? report.checks[0].level : null;
  $("healthdot").className = "dot" + (worst === "error" ? " bad" : worst === "warn" ? " warn" : "");

  content.appendChild(drawTiles(report));
  content.appendChild(drawChecks(report));
  content.appendChild(drawStorage(report));
  content.appendChild(drawCapture(report));
  content.appendChild(drawAnalysis(report));
  content.appendChild(drawArchive(report));
  content.appendChild(drawRenders(report));
  content.appendChild(drawRetention(report));
  content.appendChild(drawHost(report));
  content.appendChild(drawConfig(report));
}

function drawStat() {
  const parts = [];
  if (state.loadedAt) parts.push("updated " + dur((Date.now() - state.loadedAt) / 1000) + " ago");
  if (state.report && state.report.collected_in_ms !== undefined) {
    parts.push(state.report.cached
      ? "cached " + dur(state.report.cache_age_seconds)
      : "scanned in " + Math.round(state.report.collected_in_ms) + "ms");
  }
  if (state.error) parts.push("refresh failed");
  $("stat").textContent = parts.join(" \u00b7 ") || "Loading\u2026";
}

function drawTiles(report) {
  const tiles = el("div", "tiles");
  const disk = report.disk;

  if (disk.available) {
    const tone = disk.floor_met === false ? "bad" : disk.used_fraction > 0.9 ? "warn" : "ok";
    const box = tile("Disk free", bytes(disk.free_bytes),
      pct(disk.used_fraction) + " of " + bytes(disk.total_bytes) + " used", tone);
    box.appendChild(meter(disk.used_fraction, tone === "ok" ? "ok" : tone));
    box.lastChild.classList.add("bar");
    tiles.appendChild(box);
  }

  tiles.appendChild(tile("Library", bytes(report.storage.total_bytes),
    count(report.storage.by_track.image.files) + " stills \u00b7 "
    + count(report.storage.by_track.timelapse.files) + " clips"));

  const capture = report.capture;
  const cameraTone = capture.live >= capture.expected ? "ok"
    : capture.live === 0 ? "bad" : "warn";
  tiles.appendChild(tile("Cameras live", capture.live + " / " + capture.expected,
    "every " + dur(capture.interval_seconds) + " at " + capture.resolution, cameraTone));

  const analysis = report.analysis;
  if (analysis.enabled && analysis.reachable) {
    const lag = analysis.worst_lag_seconds;
    const losing = analysis.channels.some(
      row => row.state === "losing" || row.state === "stopped");
    const tone = losing ? "bad" : lag === null ? undefined : lag > 6 * 3600 ? "warn" : "ok";
    tiles.appendChild(tile("Analysis lag", lag === null ? "\u2014" : dur(lag),
      count(analysis.backlog_frames) + " frames to go", tone));
  } else {
    tiles.appendChild(tile("Analysis", analysis.enabled ? "no index" : "off",
      analysis.enabled ? "the analyzer has not run yet" : "recognition is disabled"));
  }

  const growth = report.growth;
  tiles.appendChild(tile("Growth", bytes(growth.measured_bytes_per_day) + "/day",
    growth.saturated ? "at steady state"
      : growth.days_until_floor !== null ? growth.days_until_floor + " days to the floor"
      : "settles near " + bytes(growth.steady_state_bytes),
    growth.steady_state_fits === false ? "warn" : undefined));

  const outstanding = report.renders.outstanding;
  tiles.appendChild(tile("Renders due", count(outstanding),
    report.renders.cadences.join(" \u00b7 "),
    outstanding === 0 ? "ok" : outstanding > 6 ? "warn" : undefined));

  const archive = report.archive;
  if (archive && archive.enabled) {
    const floorBad = archive.disk && archive.disk.floor_met === false;
    tiles.appendChild(tile("Archive", bytes(archive.total_bytes),
      archive.backlog_segments
        ? count(archive.backlog_segments) + " segments to fetch"
        : count(archive.total_files) + " segments \u00b7 up to date",
      floorBad ? "warn" : archive.backlog_segments ? undefined : "ok"));
  }

  return tiles;
}

function drawChecks(report) {
  const wrap = el("section");
  wrap.appendChild(el("h2", "", "Checks"));
  if (!report.checks.length) {
    const clear = el("div", "allclear");
    clear.append(pill("ok", "ok"), el("span", "", "Nothing to report. Every check passed."));
    wrap.appendChild(clear);
    return wrap;
  }
  const list = el("div", "checks");
  for (const check of report.checks) {
    const row = el("div", "check " + check.level);
    const tone = check.level === "error" ? "bad" : check.level === "warn" ? "warn" : "";
    row.appendChild(pill(check.level, tone));
    const text = el("div", "txt");
    text.append(el("div", "title", check.title), el("div", "detail", check.detail));
    row.appendChild(text);
    list.appendChild(row);
  }
  wrap.appendChild(list);
  return wrap;
}

const STORAGE_PARTS = [
  ["image", "Stills", "--image"],
  ["keyframe", "Keyframes", "--keyframe"],
  ["timelapse", "Videos", "--timelapse"],
  ["crops", "Crops", "--crops"],
  ["index", "Index", "--index"],
];

function drawStorage(report) {
  const storage = report.storage;
  const sizes = {
    image: storage.by_track.image.bytes,
    keyframe: storage.by_track.keyframe.bytes,
    timelapse: storage.by_track.timelapse.bytes,
    crops: storage.crops.bytes,
    index: storage.index.bytes,
  };
  const total = Object.values(sizes).reduce((sum, value) => sum + value, 0) || 1;

  const composition = panel([el("b", "", bytes(storage.total_bytes)), "across the library"]);
  const stack = el("div", "stack");
  for (const [key, , variable] of STORAGE_PARTS) {
    if (!sizes[key]) continue;
    const slice = el("span");
    slice.style.width = (sizes[key] / total) * 100 + "%";
    slice.style.background = "var(" + variable + ")";
    slice.title = key + ": " + bytes(sizes[key]);
    stack.appendChild(slice);
  }
  composition.body.appendChild(stack);

  const key = el("div", "key");
  for (const [name, label, variable] of STORAGE_PARTS) {
    const item = el("div", "item");
    const swatch = el("span", "swatch");
    swatch.style.background = "var(" + variable + ")";
    item.append(swatch, el("span", "", label), el("b", "", bytes(sizes[name])));
    key.appendChild(item);
  }
  composition.body.appendChild(key);
  composition.body.appendChild(el("p", "note",
    "Keyframes are hardlinks to stills, so a keyframe whose still is still on disk "
    + "costs nothing of its own and is counted under stills \u2014 which is why this "
    + "figure reads 0 B until retention starts unlinking the originals. Nothing here "
    + "is counted twice."));

  const rows = storage.channels.map(row => [
    cell("Camera " + row.channel),
    cell(bytes(row.bytes), {num: true}),
    cell(count(row.image.files), {num: true}),
    cell(bytes(row.image.unique_bytes), {num: true}),
    cell(count(row.keyframe.files), {num: true}),
    cell(bytes(row.keyframe.bytes), {num: true, dim: true}),
    cell(count(row.timelapse.files), {num: true}),
    cell(bytes(row.timelapse.bytes), {num: true}),
  ]);
  const perChannel = panel(["Per camera"]);
  perChannel.body.appendChild(table([
    {label: "Camera"},
    {label: "Total", num: true},
    {label: "Stills", num: true},
    {label: "Still bytes", num: true},
    {label: "Keyframes", num: true},
    {label: "Linked", num: true},
    {label: "Clips", num: true},
    {label: "Clip bytes", num: true},
  ], rows));

  return section("Storage", composition, perChannel);
}

const CAPTURE_TONE = {live: "ok", stale: "bad", silent: "warn", retired: "", idle: ""};

function drawCapture(report) {
  const capture = report.capture;
  const rows = capture.channels.map(row => [
    cell("Camera " + row.channel),
    nodeCell(pill(row.state, CAPTURE_TONE[row.state] || "")),
    cell(row.last_frame ? ago(row.last_frame) : "never",
         {num: true, dim: row.state !== "live"}),
    cell(count(row.frames_recent.hour) + " / " + Math.round(row.expected_recent.hour || 0),
         {num: true}),
    cell(pct(row.yield.hour), {num: true}),
    cell(count(row.frames_recent.day), {num: true}),
    cell(pct(row.yield.day), {num: true}),
    cell(bytes(row.mean_frame_bytes), {num: true, dim: true}),
    cell(bytes(row.bytes_per_day), {num: true}),
    cell(row.last_keyframe ? ago(row.last_keyframe) : "never", {num: true, dim: true}),
  ]);

  const box = panel([
    el("b", "", capture.live + " of " + capture.expected + " live"),
    "one snapshot every " + dur(capture.interval_seconds) + " per camera,",
    "late after " + dur(capture.stale_after_seconds),
  ]);
  box.body.appendChild(table([
    {label: "Camera"},
    {label: "State"},
    {label: "Last frame", num: true},
    {label: "Last hour", num: true},
    {label: "Yield 1h", num: true},
    {label: "Last day", num: true},
    {label: "Yield 24h", num: true},
    {label: "Mean frame", num: true},
    {label: "Per day", num: true},
    {label: "Keyframe", num: true},
  ], rows));
  box.body.appendChild(el("p", "note",
    "Yield is frames on disk against frames the interval should have produced, "
    + "measured against how long the camera has actually been running so a channel "
    + "added this morning is not reported as having missed yesterday."));

  return section("Capture", box);
}

const ANALYSIS_TONE = {
  current: "ok", behind: "warn", losing: "bad", stopped: "bad",
  unstarted: "", unknown: "", retired: "",
};

function drawAnalysis(report) {
  const analysis = report.analysis;
  if (!analysis.enabled) {
    const box = panel(["Recognition is disabled"]);
    box.body.appendChild(el("p", "empty",
      "Nothing analyses the stills, so there is no backlog to fall behind on. "
      + "Turn it on in the [analysis] section of the config."));
    return section("Analysis", box);
  }
  if (!analysis.reachable) {
    const box = panel(["Recognition is enabled, but the index is not there yet"]);
    box.body.appendChild(el("p", "empty",
      "The analyzer creates " + analysis.index_path + " on its first run. Until then "
      + "the viewer serves timelapses only."));
    return section("Analysis", box);
  }

  const rows = analysis.channels.map(row => [
    cell("Camera " + row.channel),
    nodeCell(pill(row.state, ANALYSIS_TONE[row.state] || "")),
    cell(row.analysed_through ? stamp(row.analysed_through) : "never", {num: true}),
    cell(row.lag_seconds === null ? "\u2014" : dur(row.lag_seconds), {num: true}),
    cell(count(row.backlog_frames), {num: true}),
    cell(row.rate === null ? "measuring" : row.rate.toFixed(2) + "\u00d7",
         {num: true, dim: row.rate === null}),
    cell(row.eta_seconds === null || row.eta_seconds === undefined
      ? (row.state === "current" ? "caught up" : "\u2014") : "in " + dur(row.eta_seconds),
      {num: true}),
    nodeCell(row.reads_plates ? pill("plates") : el("span", "dim", "\u2014")),
  ]);

  const box = panel([
    el("b", "", analysis.worst_lag_seconds === null
      ? "no watermark yet" : dur(analysis.worst_lag_seconds) + " behind at worst"),
    count(analysis.backlog_frames) + " frames outstanding",
  ]);
  box.body.appendChild(table([
    {label: "Camera"},
    {label: "State"},
    {label: "Analysed through", num: true},
    {label: "Lag", num: true},
    {label: "Backlog", num: true},
    {label: "Rate", num: true},
    {label: "Catches up", num: true},
    {label: "Plates"},
  ], rows));
  box.body.appendChild(el("p", "note",
    "Lag is measured against the newest still on disk, not against the clock: "
    + "analysis can never be nearer than one capture interval to now. Rate is how "
    + "many seconds of footage are analysed per second of wall clock, sampled while "
    + "this page is open \u2014 1.00\u00d7 is exactly keeping pace, and anything less "
    + "than that while behind never catches up."));

  const counts = analysis.counts || {};
  const index = panel([el("b", "", bytes(report.storage.index.bytes)), "index and write-ahead log"]);
  index.body.appendChild(pairs([
    ["Sightings", count(counts.event)],
    ["Detections", count(counts.detection)],
    ["Plate reads", count(counts.plate)],
    ["People and vehicles", count(counts.identity)],
    ["Named", count(counts.named_identity)],
    ["Signatures", count(counts.signature)],
    ["Crops", count(report.storage.crops.files) + " \u00b7 " + bytes(report.storage.crops.bytes)],
    ["Oldest sighting", counts.oldest_event
      ? stamp(new Date(counts.oldest_event * 1000).toISOString()) : "\u2014"],
    ["Detection retention", analysis.retention.detection_seconds === null
      ? "forever" : dur(analysis.retention.detection_seconds)],
    ["Sighting retention", analysis.retention.event_seconds === null
      ? "forever" : dur(analysis.retention.event_seconds)],
    ["Score threshold", String(analysis.settings.score_threshold)],
    ["Threads / batch", analysis.settings.threads + " / " + analysis.settings.batch_size],
    ["Re-identification", analysis.settings.reid_enabled
      ? "on at " + analysis.settings.reid_threshold : "off"],
    ["Plates read on", analysis.settings.plate_channels.length
      ? "camera " + analysis.settings.plate_channels.join(", ") : "no cameras"],
  ]));

  return section("Analysis", box, index);
}

function drawArchive(report) {
  const archive = report.archive;
  if (!archive || !archive.enabled) {
    const box = panel(["The replica is off"]);
    box.body.appendChild(el("p", "empty",
      "No [archive] root is configured, so nothing replicates the NVR's own "
      + "recordings. The footage the cameras record lives only on the NVR, for "
      + "as long as its quota keeps it."));
    return section("Archive", box);
  }

  const rows = archive.channels.map(row => [
    cell("Camera " + row.channel),
    cell(count(row.files), {num: true}),
    cell(bytes(row.bytes), {num: true}),
    cell(row.oldest ? stamp(row.oldest) : "\u2014", {num: true, dim: !row.oldest}),
    cell(row.newest ? stamp(row.newest) : "\u2014", {num: true, dim: !row.newest}),
    cell(row.lag_seconds === null ? "\u2014" : dur(row.lag_seconds),
         {num: true, dim: row.lag_seconds === null}),
    cell(row.backlog_segments === null ? "\u2014" : count(row.backlog_segments),
         {num: true, dim: row.backlog_segments === null}),
    cell(row.failing_segments ? count(row.failing_segments) : "\u2014",
         {num: true, dim: !row.failing_segments}),
    cell(row.abandoned_segments ? count(row.abandoned_segments) : "\u2014",
         {num: true, dim: !row.abandoned_segments}),
    cell(row.expired_segments ? count(row.expired_segments) : "\u2014",
         {num: true, dim: !row.expired_segments}),
  ]);

  const box = panel([
    el("b", "", count(archive.total_files) + " segments \u00b7 " + bytes(archive.total_bytes)),
    archive.backlog_segments
      ? count(archive.backlog_segments) + " fetchable segments not replicated yet"
        + (archive.failing_segments
           ? " · " + count(archive.failing_segments) + " failing, in retry backoff" : "")
        + (archive.abandoned_segments
           ? " · " + count(archive.abandoned_segments) + " given up on" : "")
      : "everything still fetchable is replicated"
        + (archive.abandoned_segments
           ? " · " + count(archive.abandoned_segments) + " given up on" : ""),
  ]);
  box.body.appendChild(table([
    {label: "Camera"},
    {label: "Segments", num: true},
    {label: "Size", num: true},
    {label: "Oldest", num: true},
    {label: "Newest", num: true},
    {label: "Behind", num: true},
    {label: "Backlog", num: true},
    {label: "Failing", num: true},
    {label: "Given up", num: true},
    {label: "Expired", num: true},
  ], rows));

  const disk = archive.disk || {};
  box.body.appendChild(pairs([
    ["Volume", archive.root],
    ["Free", disk.available
      ? bytes(disk.free_bytes) + " of " + bytes(disk.total_bytes) : "unknown"],
    ["Floor", bytes(archive.minimum_free_bytes)],
    ["Retention", archive.retention_seconds === null
      ? "until the floor bites, oldest days first" : dur(archive.retention_seconds)],
  ]));
  box.body.appendChild(el("p", "note",
    "Behind is the newest recording the NVR reports against the newest segment "
    + "replicated here \u2014 large numbers are normal while the initial backfill "
    + "runs, because it fetches oldest first. Backlog compares the footage "
    + "mirror's segment count with the files on this volume, less Expired \u2014 "
    + "footage the device recycled before it was ever fetched, gone for good \u2014 "
    + "and Given up, segments written off after repeated refusals. Failing is "
    + "segments whose last fetch the device refused, waiting out a retry "
    + "backoff; after enough failures the archiver gives up on them for good, "
    + "so the backlog always means footage still expected to arrive."));
  return section("Archive", box);
}

function drawRenders(report) {
  const renders = report.renders;
  const columns = [{label: "Camera"}].concat(
    renders.cadences.map(name => ({label: name, num: true})));

  const rows = renders.channels.map(row => {
    const line = [cell("Camera " + row.channel)];
    for (const name of renders.cadences) {
      const entry = row.cadences.find(candidate => candidate.cadence === name);
      if (!entry) { line.push(cell("\u2014", {num: true, dim: true})); continue; }
      const holder = el("div");
      holder.style.textAlign = "right";
      const missing = entry.missing_periods;
      holder.appendChild(el("div", "", count(entry.files) + " clip" + (entry.files === 1 ? "" : "s")));
      const sub = el("div", "");
      sub.style.fontSize = ".7rem";
      sub.style.color = missing ? "var(--warn)" : "var(--muted)";
      sub.textContent = missing
        ? missing + " due \u00b7 " + bytes(entry.bytes)
        : (entry.newest_written_at ? ago(entry.newest_written_at) : "none") + " \u00b7 " + bytes(entry.bytes);
      holder.appendChild(sub);
      line.push(nodeCell(holder));
    }
    return line;
  });

  const box = panel([
    el("b", "", count(renders.outstanding) + " outstanding"),
    "closed periods inside retention with no video on disk",
  ]);
  box.body.appendChild(table(columns, rows));
  box.body.appendChild(el("p", "note",
    "Counted from the videos on disk rather than from the renderer's own queue, so "
    + "a period the renderer skipped for holding too few frames is reported here as "
    + "due \u2014 which, on disk, it is."));
  return section("Renders", box);
}

function drawRetention(report) {
  const retention = report.retention;
  const box = panel(["Frames"]);
  const rows = retention.tracks.map(row => {
    const fraction = row.used_fraction;
    const tone = fraction === null ? "accent" : fraction > 1 ? "bad" : fraction > 0.9 ? "warn" : "ok";
    const bar = meter(Math.min(fraction || 0, 1), tone);
    bar.style.width = "120px";
    return [
      cell(row.track === "image" ? "Stills" : "Keyframes"),
      cell(row.retention_seconds === null ? "forever" : dur(row.retention_seconds), {num: true}),
      cell(row.oldest ? ago(row.oldest) : "\u2014", {num: true}),
      cell(fraction === null ? "\u2014" : pct(fraction), {num: true}),
      nodeCell(bar),
    ];
  });
  box.body.appendChild(table([
    {label: "Track"},
    {label: "Kept for", num: true},
    {label: "Oldest on disk", num: true},
    {label: "Of retention", num: true},
    {label: ""},
  ], rows));
  box.body.appendChild(el("p", "note",
    "Retention must outlast the longest still-sourced cadence \u2014 "
    + retention.longest_image_cadence + ", at "
    + dur(retention.longest_image_cadence_seconds)
    + " \u2014 or the frames it reads are pruned before it can render them."));

  const videos = panel(["Videos"]);
  videos.body.appendChild(table([
    {label: "Cadence"},
    {label: "Kept for", num: true},
    {label: "Oldest", num: true},
    {label: "Files", num: true},
  ], retention.cadences.map(row => [
    cell(row.cadence),
    cell(row.retention_seconds === null ? "forever" : dur(row.retention_seconds), {num: true}),
    cell(row.oldest ? ago(row.oldest) : "\u2014", {num: true}),
    cell(count(row.files), {num: true}),
  ])));

  return section("Retention", box, videos);
}

const UNIT_TONE = {active: "ok", failed: "bad", inactive: "warn", activating: "warn"};

function drawHost(report) {
  const host = report.host;
  const disk = report.disk;
  const memory = host.memory_total_bytes
    ? bytes(host.memory_total_bytes - (host.memory_available_bytes || 0))
      + " of " + bytes(host.memory_total_bytes)
    : "\u2014";

  const box = panel([el("b", "", host.hostname), host.platform]);
  box.body.appendChild(pairs([
    ["Uptime", host.uptime_seconds === null ? "\u2014" : dur(host.uptime_seconds)],
    ["Load average", host.load_average ? host.load_average.join("  ") : "\u2014"],
    ["CPUs", count(host.cpus)],
    ["Memory used", memory],
    ["Viewer process", "pid " + host.pid + " \u00b7 " + host.threads + " threads"
      + (host.process_rss_bytes ? " \u00b7 " + bytes(host.process_rss_bytes) : "")],
    ["Python", host.python],
    ["Filesystem", disk.available
      ? bytes(disk.used_bytes) + " of " + bytes(disk.total_bytes) + " (" + pct(disk.used_fraction) + ")"
      : "\u2014"],
    ["Free-space floor", disk.minimum_free_bytes
      ? bytes(disk.minimum_free_bytes) + " \u00b7 " + bytes(disk.headroom_bytes) + " spare"
      : "disabled"],
    ["Library root", disk.path || "\u2014"],
  ]));

  const parts = [box];
  if (report.services && report.services.unavailable) {
    const services = panel(["systemd"]);
    services.body.appendChild(el("p", "empty", report.services.unavailable));
    parts.push(services);
  } else if (report.services) {
    const services = panel(["systemd"]);
    services.body.appendChild(table([
      {label: "Unit"},
      {label: "State"},
      {label: "Sub"},
      {label: "Since", num: true},
      {label: "Restarts", num: true},
      {label: "Memory", num: true},
    ], Object.entries(report.services).map(([unit, detail]) => [
      cell(unit),
      nodeCell(pill(detail.active || "unknown", UNIT_TONE[detail.active] || "")),
      cell(detail.sub, {dim: true}),
      cell(detail.since || "\u2014", {num: true, dim: true}),
      cell(count(detail.restarts), {num: true}),
      cell(bytes(detail.memory_bytes), {num: true}),
    ])));
    parts.push(services);
  }

  return section("Host", ...parts);
}

function drawConfig(report) {
  const config = report.config;
  const box = panel(["Settings in force"]);
  box.body.appendChild(pairs([
    ["Channels", config.channels.join(", ") || "none"],
    ["Capture interval", dur(config.capture_interval_seconds)],
    ["Resolution", config.resolution],
    ["Video length", dur(config.video_duration_seconds)],
    ["Render timezone", config.render_timezone],
    ["Concurrent renders", String(config.max_concurrent_renders)],
    ["Deflicker keyframes", config.deflicker_keyframe_renders ? "on" : "off"],
    ["Keyframe at", config.keyframe_at + " \u00b1 " + dur(config.keyframe_tolerance_seconds)],
    ["Library root", config.library_root],
    ["Listening on", config.web],
  ]));

  const cadences = panel(["Cadences"]);
  cadences.body.appendChild(table([
    {label: "Cadence"},
    {label: "Window", num: true},
    {label: "Reads"},
    {label: "FPS", num: true},
    {label: "Min frames", num: true},
    {label: "Kept for", num: true},
  ], config.cadences.map(cadence => [
    cell(cadence.name + (cadence.anchored ? " (anchored)" : "")),
    cell(dur(cadence.window_seconds), {num: true}),
    cell(cadence.source === "image" ? "stills" : "keyframes", {dim: true}),
    cell(String(cadence.fps), {num: true}),
    cell(count(cadence.min_frames), {num: true}),
    cell(cadence.retention_seconds === null ? "forever" : dur(cadence.retention_seconds), {num: true}),
  ])));

  return section("Configuration", box, cadences);
}

// --- wiring -----------------------------------------------------------------

// The button skips the cache; the poll below does not, so an open page costs a
// scan only when someone actually asks for one.
$("refresh").onclick = () => { if (!state.loading) load(true); };

// Slower than the report's own cache, so a poll almost always costs a cached
// answer rather than a fresh scan of the library.
setInterval(() => load(false), 20000);
// The "updated Ns ago" reading has to move even when nothing else does.
setInterval(drawStat, 1000);

load();
</script>
</body>
</html>
