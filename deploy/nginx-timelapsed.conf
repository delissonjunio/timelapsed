# nginx in front of the timelapsed viewer.
#
# Installed to /etc/nginx/sites-available/timelapsed by `install.sh --with-nginx`,
# which substitutes __LIBRARY_ROOT__, __LISTEN_PORT__ and __UPSTREAM_PORT__ with
# the values in /etc/timelapsed.ini. Edit this file rather than the installed
# copy: deploy/update.sh re-renders it on every upgrade.
#
# What this buys, in the order the difference is actually noticeable:
#
#   1. Conditional requests. The Python viewer sends no ETag, no Last-Modified
#      and no Cache-Control, so re-opening yesterday's daily downloads all
#      140 MB of it again. nginx answers the second visit with a 304.
#   2. Page cache. Python reads a video into userspace 256 KB at a time, which
#      pulls the whole file through the guest's page cache and evicts what the
#      renders want. See directio below.
#   3. Threads. ThreadingHTTPServer spawns one per connection, and a browser
#      scrubbing a timeline opens several while every camera tile is polling a
#      thumbnail; nginx serves the lot from one worker.
#
# What it does NOT buy is a faster single stream. Over Tailscale the WireGuard
# tunnel is the ceiling long before Python's copy loop is.

server {
    listen __LISTEN_PORT__;
    listen [::]:__LISTEN_PORT__;
    server_name _;

    access_log /var/log/nginx/timelapsed.access.log;
    error_log  /var/log/nginx/timelapsed.error.log;

    # Nothing here accepts an upload; this only bounds what a stray POST costs.
    client_max_body_size 1m;

    # The page is one large inline document and the activity API is verbose
    # JSON. Videos and thumbnails are already compressed, so they are absent
    # from gzip_types on purpose.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_vary on;
    # Tailscale Serve is itself a proxy; without this, gzip switches off for
    # every request that arrives through it carrying a Via header.
    gzip_proxied any;

    # Rendered videos come off the disk directly. The regex mirrors the URLs
    # TimelapseEntry.as_dict builds, and tests/test_nginx_config.py holds the
    # two together. Neither capture can contain a slash and the channel cannot
    # begin with a dot, so no request can walk out of the library.
    location ~ "^/video/([^/.][^/]*)/([^/]+\.mp4)$" {
        # Quoted so that a library root with a space in it still parses; nginx
        # interpolates $1 and $2 inside double quotes just the same.
        alias "__LIBRARY_ROOT__/$1/timelapse/$2";

        # Safari refuses to play video it is not told the type of, and this
        # location only ever serves one type.
        types { }
        default_type video/mp4;

        # A render is 140 MB read once, so putting it through the page cache
        # only evicts the stills the next ffmpeg wants. directio skips the
        # cache; aio keeps the resulting blocking reads off the worker.
        # install.sh comments both out if nginx was built without --with-threads
        # (directio alone would stall the event loop on every read).
        aio threads;
        directio 16m;
        # 512 is enough for ext4 but not for XFS, and 4k is correct for both.
        directio_alignment 4k;
        output_buffers 2 1m;
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;

        open_file_cache max=256 inactive=5m;
        open_file_cache_valid 1m;
        open_file_cache_errors on;

        # A rendered window is immutable once written and its name states the
        # window it covers, so a revisit should cost a 304 rather than a
        # re-download. private: this is somebody's camera footage.
        add_header Cache-Control "private, max-age=86400" always;

        # If the file is missing or nginx cannot read it, fall back to the
        # viewer rather than showing the user a 403. A permissions mistake then
        # costs speed instead of playback.
        error_page 403 404 = @viewer;
    }

    # The live wall's stream relay. go2rtc listens on localhost only, so this
    # is what hands the /live page its player script and the MSE/WebRTC
    # signalling websocket, on the same origin as everything else. Installed by
    # deploy/go2rtc-setup.sh; without it these paths answer 502, which the live
    # page shows as every tile stuck on "connecting".
    # tests/test_nginx_config.py holds this prefix and the page together.
    location /go2rtc/ {
        proxy_pass http://127.0.0.1:1984/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A tile's websocket stays open as long as the wall is; the default
        # 60s of proxy_read_timeout would cut every stream off in a minute.
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
        proxy_buffering off;
    }

    # The page, the JSON APIs, the ffmpeg-scaled thumbnails and the detection
    # crops are all generated, so they stay with Python. A /video/ request that
    # does not match the regex above lands here too.
    location / {
        proxy_pass http://127.0.0.1:__UPSTREAM_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Big enough that an activity payload or a thumbnail is answered from
        # memory rather than spooled to a temp file.
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
        proxy_read_timeout 60s;
    }

    location @viewer {
        proxy_pass http://127.0.0.1:__UPSTREAM_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
